name: Take App Screenshots

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to download MSIX from (e.g., v2.2.0-windows-preview)'
        required: false
        default: ''

jobs:
  screenshots:
    name: Take Screenshots of App UI
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable Developer Mode
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d 1
          Write-Host "Developer Mode enabled"

      - name: Download MSIX from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the release tag - use input or latest
          $tag = "${{ github.event.inputs.release_tag }}"
          if ([string]::IsNullOrEmpty($tag)) {
            # Get latest release tag
            $tag = (gh release list --limit 1 --json tagName -q ".[0].tagName")
            Write-Host "Using latest release: $tag"
          } else {
            Write-Host "Using specified release: $tag"
          }

          # Download MSIX from release
          gh release download $tag --pattern "*.msix" -R "${{ github.repository }}" --dir .
          Write-Host "Downloaded MSIX files:"
          Get-ChildItem -Filter "*.msix"

      - name: Install MSIX
        run: |
          $msix = Get-ChildItem -Filter "*.msix" | Select-Object -First 1
          if ($msix) {
            Write-Host "Installing: $($msix.FullName)"
            Add-AppxPackage -Path $msix.FullName -DependencyPackages @() -ForceApplicationShutdown
            Write-Host "MSIX installed successfully"
          } else {
            Write-Host "No MSIX found!"
            exit 1
          }

      - name: Find App Executable
        id: find-app
        run: |
          # Get installed app info
          $app = Get-AppxPackage | Where-Object { $_.Name -like "*Melophile*" -or $_.Name -like "*SimpMusic*" -or $_.Name -like "*simpmusic*" } | Select-Object -First 1
          if ($app) {
            Write-Host "Found app: $($app.Name)"
            Write-Host "PackageFullName: $($app.PackageFullName)"

            # Get the executable path
            $manifest = "$env:ProgramFiles\WindowsApps\$($app.PackageFullName)\AppxManifest.xml"
            if (Test-Path $manifest) {
              [xml]$xml = Get-Content $manifest
              $exe = $xml.Package.Applications.Application.Executable
              $appId = $xml.Package.Applications.Application.Id
              Write-Host "Executable: $exe"
              Write-Host "AppId: $appId"

              # Save for next step
              "EXE_PATH=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
              "APP_ID=$appId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
              "PACKAGE_NAME=$($app.PackageFullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
            }
          } else {
            Write-Host "App not found!"
            Get-AppxPackage | Where-Object { $_.Name -like "*melophile*" -or $_.Name -like "*simp*" }
            exit 1
          }

      - name: Launch App and Take Screenshots
        run: |
          $exePath = "${{ steps.find-app.outputs.EXE_PATH }}"
          $appId = "${{ steps.find-app.outputs.APP_ID }}"
          $packageName = "${{ steps.find-app.outputs.PACKAGE_NAME }}"

          Write-Host "Launching: $exePath"

          # Create screenshots directory
          New-Item -ItemType Directory -Force -Path screenshots

          # Function to take screenshot
          function Take-Screenshot {
            param([string]$name, [int]$wait=5)
            Start-Sleep -Seconds $wait
            Start-Process -FilePath "powershell" -ArgumentList "-Command", "Add-Type -AssemblyName System.Windows.Forms; `$bmp = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; `$graphics = [System.Drawing.Graphics]::FromImage(`$bmp); `$graphics.CopyFromScreen(`$bmp.Location, [System.Drawing.Point]::Empty, `$bmp.Size); `$graphics.Dispose(); `$bmp.Save('screenshots/$name.png', [System.Drawing.Imaging.ImageFormat]::Png); `$bmp.Dispose()" -NoNewWindow
            Start-Sleep -Seconds 2
            if (Test-Path "screenshots/$name.png") {
              Write-Host "Captured: $name.png"
            }
          }

          # Launch app
          Start-Process -FilePath $exePath -ArgumentList $appId
          Start-Sleep -Seconds 10

          # Take screenshot 1: Initial/Home screen
          Write-Host "Taking screenshot: home"
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $screenshot = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $graphics = [System.Drawing.Graphics]::FromImage($screenshot)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $screenshot.Save("screenshots/1-home.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $screenshot.Dispose()
          Write-Host "Captured: 1-home.png"

          # Try to navigate to Library (press Ctrl+L or similar)
          Write-Host "Navigating to Library..."
          [System.Windows.Forms.SendKeys]::SendWait("^{L}")
          Start-Sleep -Seconds 3

          # Take screenshot 2: Library
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $screenshot = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $graphics = [System.Drawing.Graphics]::FromImage($screenshot)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $screenshot.Save("screenshots/2-library.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $screenshot.Dispose()

          # Try to navigate to Search (press Ctrl+K or click search)
          Write-Host "Navigating to Search..."
          [System.Windows.Forms.SendKeys]::SendWait("^{K}")
          Start-Sleep -Seconds 3

          # Take screenshot 3: Search
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $screenshot = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $graphics = [System.Drawing.Graphics]::FromImage($screenshot)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $screenshot.Save("screenshots/3-search.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $screenshot.Dispose()

          # Try to navigate to Settings (press Ctrl+, or click settings icon)
          Write-Host "Navigating to Settings..."
          [System.Windows.Forms.SendKeys]::SendWait("^,")
          Start-Sleep -Seconds 3

          # Take screenshot 4: Settings
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $screenshot = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $graphics = [System.Drawing.Graphics]::FromImage($screenshot)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $screenshot.Save("screenshots/4-settings.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $screenshot.Dispose()

          Write-Host "All screenshots captured!"

          # List files
          Get-ChildItem screenshots

          # Kill the app
          Stop-Process -Name "Melophile" -Force -ErrorAction SilentlyContinue
          Stop-Process -Name "simpmusic" -Force -ErrorAction SilentlyContinue

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 30

      - name: List Artifacts
        run: |
          Write-Host "Screenshots uploaded successfully!"
          Write-Host "Download from: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
