name: Take App Screenshots

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to download MSIX from (e.g., v2.2.0-windows-preview)'
        required: false
        default: ''

env:
  WINDOW_WIDTH: 1500
  WINDOW_HEIGHT: 860
  WINDOW_X: 210
  WINDOW_Y: 110
  NAV_X: 246
  HOME_Y: 202
  SEARCH_Y: 266
  LIBRARY_Y: 322
  SETTINGS_Y: 926

jobs:
  screenshots:
    name: Take Screenshots of App UI
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable Developer Mode
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d 1
          Write-Host "Developer Mode enabled"

      - name: Download MSIX from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.release_tag }}"
          if ([string]::IsNullOrEmpty($tag)) {
            $tag = (gh release list --limit 1 --json tagName -q ".[0].tagName")
            Write-Host "Using latest release: $tag"
          } else {
            Write-Host "Using specified release: $tag"
          }
          gh release download $tag --pattern "*.msix" -R "${{ github.repository }}" --dir .
          Get-ChildItem -Filter "*.msix"

      - name: Trust MSIX Certificate
        run: |
          $msix = Get-ChildItem -Filter "*.msix" | Select-Object -First 1
          if (-not $msix) { Write-Host "No MSIX found!"; exit 1 }
          Write-Host "MSIX: $($msix.FullName)"
          # Extract signer certificate and install to TrustedPeople store
          $sig = Get-AuthenticodeSignature -FilePath $msix.FullName
          if ($sig.SignerCertificate) {
            $cert = $sig.SignerCertificate
            Write-Host "Signer: $($cert.Subject)"
            $store = [System.Security.Cryptography.X509Certificates.X509Store]::new("TrustedPeople", "LocalMachine")
            $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
            try {
              $store.Add($cert)
              Write-Host "Certificate added to TrustedPeople"
            } catch {
              Write-Host "Cert may already exist: $_"
            }
            $store.Close()
          } else {
            Write-Host "WARNING: No signer certificate found"
          }

      - name: Install MSIX
        run: |
          $msix = Get-ChildItem -Filter "*.msix" | Select-Object -First 1
          if (-not $msix) {
            Write-Host "No MSIX found!"
            exit 1
          }
          Write-Host "Installing: $($msix.FullName)"
          Add-AppxPackage -Path $msix.FullName -ForceApplicationShutdown
          Write-Host "MSIX installed"

      - name: Find App Executable
        id: find-app
        run: |
          $app = Get-AppxPackage | Where-Object {
            $_.Name -like "*Melophile*" -or
            $_.Name -like "*SimpMusic*" -or
            $_.Name -like "*simpmusic*"
          } | Select-Object -First 1

          if (-not $app) {
            Write-Host "App not found in installed packages!"
            Get-AppxPackage | Where-Object { $_.Name -like "*mel*" -or $_.Name -like "*simp*" }
            exit 1
          }

          Write-Host "Found: $($app.Name)"
          $manifest = "$env:ProgramFiles\WindowsApps\$($app.PackageFullName)\AppxManifest.xml"
          [xml]$xml = Get-Content $manifest
          $exe = $xml.Package.Applications.Application.Executable
          $appId = $xml.Package.Applications.Application.Id

          Write-Host "Executable: $exe"
          Write-Host "AppId: $appId"

          "EXE_PATH=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          "APP_ID=$appId"  | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Run Screenshots
        run: |
          & "${{ github.workspace }}\.github\workflows\scripts\take-screenshots.ps1"
        shell: pwsh

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 30

      - name: Summary
        run: |
          Write-Host "Screenshots captured!"
          Write-Host "Artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          Get-ChildItem screenshots | ForEach-Object { Write-Host "  $_" }
