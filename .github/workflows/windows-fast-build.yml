name: Fast Windows Build (No ProGuard, ~4 mins)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/windows-fast-build.yml'

permissions:
  contents: write
  actions: write

jobs:
  build-windows-fast:
    name: Fast Windows MSIX Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Setup local.properties
        run: |
          touch ./local.properties
          echo 'SENTRY_DSN=""' >> ./local.properties
          echo "SENTRY_AUTH_TOKEN=" >> ./local.properties
          echo "LASTFM_API_KEY=" >> ./local.properties
          echo "LASTFM_SECRET=" >> ./local.properties
          echo "isFullBuild=false" >> ./gradle.properties

      - name: Cache mpv-natives
        uses: actions/cache@v4
        with:
          path: mpv-natives
          key: mpv-natives-${{ hashFiles('composeApp/build.gradle.kts') }}
          restore-keys: |
            mpv-natives-

      - name: Stage mpv-natives & Write Conveyor Config (Skipping ProGuard)
        run: |
          ./gradlew exportLibraryDefinitions :composeApp:mpvSetupAll :desktopApp:writeConveyorConfig -PskipProguard=true --no-configuration-cache

      - name: Install Conveyor CLI
        run: |
          curl -fsSL https://conveyor.hydraulic.dev/install.sh | bash
          echo "$HOME/.conveyor/bin" >> $GITHUB_PATH

      - name: Package Windows MSIX with Conveyor CLI
        run: |
          conveyor --agree-to-license=1 -Kapp.machines=[windows.amd64] make windows-msix

      - name: Bundle Windows Offline Installer Package
        id: bundle
        run: |
          set -euo pipefail
          mkdir -p dist_windows

          MSIX_FILE=$(find output -name "*.msix" | head -n 1)
          if [ -z "$MSIX_FILE" ] || [ ! -f "$MSIX_FILE" ]; then
            echo "::error::No .msix file generated in output directory!"
            exit 1
          fi

          echo "Found MSIX: $MSIX_FILE"

          STAGE_DIR=$(mktemp -d)
          cp scripts/windows/install.bat "$STAGE_DIR/"

          if [ -f output/simpmusic.crt ]; then
            cp output/simpmusic.crt "$STAGE_DIR/"
          fi

          cp "$MSIX_FILE" "$STAGE_DIR/"

          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          BUNDLE_NAME="Melophile-${VERSION}-windows-fast-installer.zip"

          (cd "$STAGE_DIR" && zip -q -r "${GITHUB_WORKSPACE}/dist_windows/${BUNDLE_NAME}" .)
          rm -rf "$STAGE_DIR"

          cp "$MSIX_FILE" "dist_windows/"

          echo "BUNDLE_PATH=dist_windows/${BUNDLE_NAME}" >> $GITHUB_ENV
          echo "MSIX_PATH=$MSIX_FILE" >> $GITHUB_ENV
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

          ls -lh dist_windows/

      - name: Upload Windows Offline Installer Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Melophile-Windows-Fast-Installer
          path: ${{ env.BUNDLE_PATH }}
          if-no-files-found: warn

      - name: Upload Windows MSIX Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Melophile-Windows-Fast-MSIX
          path: ${{ env.MSIX_PATH }}
          if-no-files-found: warn
